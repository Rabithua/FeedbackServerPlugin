name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-runtime-free-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/validate_distribution.py
      - run: python3 scripts/check_sensitive_content.py
      - name: Verify installable bundle contains no local runtime
        run: |
          test ! -e plugins/feedback-server/package.json
          test ! -e plugins/feedback-server/bun.lock
          test ! -e plugins/feedback-server/bin
          test ! -e plugins/feedback-server/dist
          test ! -e plugins/feedback-server/src
      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.221
      - run: claude plugin validate --strict .
