name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --cwd=plugins/feedback-server --frozen-lockfile
      - run: bun --cwd=plugins/feedback-server run typecheck
      - run: bun --cwd=plugins/feedback-server run test
      - run: bun --cwd=plugins/feedback-server run build
      - run: bun --cwd=plugins/feedback-server run test:keyring

  linux-keyring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --cwd=plugins/feedback-server --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install --yes dbus-x11 gnome-keyring
      - name: Verify Secret Service write/read/delete
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf %s test-password | gnome-keyring-daemon --unlock
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            bun --cwd=plugins/feedback-server run test:keyring
          '

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --cwd=plugins/feedback-server --frozen-lockfile
      - run: npm install --global @anthropic-ai/claude-code@2.1.221
      - run: bun run check
      - run: bun run validate
      - run: claude plugin validate --strict .
      - run: bun run scan
      - run: git diff --exit-code -- plugins/feedback-server/dist/server.mjs plugins/feedback-server/dist/cli.mjs
