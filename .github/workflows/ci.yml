name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --cwd=plugins/feedback-server --frozen-lockfile
      - run: npm install --global @anthropic-ai/claude-code@2.1.221
      - run: bun run check
      - run: bun run validate
      - run: claude plugin validate --strict .
      - run: bun run scan
      - run: git diff --exit-code -- plugins/feedback-server/dist/server.mjs plugins/feedback-server/dist/cli.mjs
