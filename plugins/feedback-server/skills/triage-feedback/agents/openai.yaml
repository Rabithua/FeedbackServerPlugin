interface:
  display_name: "Triage Feedback"
  short_description: "Inspect, organize, and reply to Product feedback safely"
  default_prompt: "Use $triage-feedback to summarize unresolved feedback for my app and suggest next actions."
dependencies:
  tools:
    - type: "mcp"
      value: "feedback-server"
      description: "FeedbackServer feedback triage tools"
      transport: "streamable_http"
policy:
  allow_implicit_invocation: true
