interface:
  display_name: "Set Up FeedbackServer"
  short_description: "Connect browser OAuth and set up a FeedbackServer 2.0 Product"
  default_prompt: "Use $setup-feedback-server to sign in to FeedbackKit by magic link, verify whoami, and continue Product setup."
dependencies:
  tools:
    - type: "mcp"
      value: "feedback-server"
      description: "FeedbackServer setup and administrator tools"
      transport: "streamable_http"
policy:
  allow_implicit_invocation: true
