interface:
  display_name: "Set Up FeedbackServer"
  short_description: "Connect OAuth, authenticate an account, and continue setup"
  default_prompt: "Use $setup-feedback-server to authenticate my FeedbackKit account and continue the next setup step."
dependencies:
  tools:
    - type: "mcp"
      value: "feedback-server"
      description: "FeedbackServer setup and administrator tools"
      transport: "streamable_http"
policy:
  allow_implicit_invocation: true
