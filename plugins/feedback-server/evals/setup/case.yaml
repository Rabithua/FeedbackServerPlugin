schema_version: "1.1"
name: "invitation-code-oauth-onboarding"
description: "Uses automatic invitation binding with a short-code fallback inside one host-managed OAuth page."
tags: ["setup"]
execution:
  prompt: "我把 FeedbackKit 邀请 Prompt 发给你了。请安装插件，在当前任务完成账号和首个 App 接入；令牌不要放进参数或输出。"
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: []
runs: 1
graders:
  - type: "llm"
    name: "same-task-token-safety"
    focus: "last_message"
    criteria: "The response calls anonymous accept_invitation without repeating the token, keeps the short connection code available, immediately retries connection_status to open OAuth once, uses the code only if the page has not already loaded the invited identity, never requests email verification, re-asks App details after connection, requires an explicit Bark, Product Webhook, or defer choice, and requires approval before Apple project edits."
expected_outcome: "Complete one-page invitation OAuth without exposing credentials."
