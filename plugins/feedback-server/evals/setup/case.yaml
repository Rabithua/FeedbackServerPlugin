schema_version: "1.1"
name: "v2-invitation-product-onboarding"
description: "Uses the two-field FeedbackServer 2.0 invitation and continues through Product setup."
tags: ["v2", "setup", "invitation"]
execution:
  prompt: |-
    请按 FeedbackServer 2.0 协议说明如何完成邀请接入和首个 App 设置，不调用工具，也不要索取任何额外邀请凭据：
    mcp_server: https://api.feedkit.cn/mcp
    account_email: invited@example.com
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: []
runs: 1
graders:
  - type: "llm"
    name: "two-field-invitation-onboarding"
    focus: "last_message"
    criteria: "The response uses only mcp_server and account_email, connects the remote MCP, completes browser magic-link sign-in as that email, calls whoami and verifies the email, then calls list_products. With no Product it asks for App name, platform, default locale, and an explicit Bark, webhook, or deferred choice before create_product; it obtains approval before App project edits."
expected_outcome: "Complete the v2 invited-user sign-in and guided first-Product workflow without another invitation credential."
