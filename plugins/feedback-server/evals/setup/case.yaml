schema_version: "1.1"
name: "invitation-code-oauth-onboarding"
description: "Uses a proactively displayed connection code inside one host-managed OAuth page."
tags: ["setup"]
execution:
  prompt: "我把 FeedbackKit 邀请 Prompt 发给你了。请安装插件，在当前任务完成账号和首个 App 接入；令牌不要放进参数或输出。"
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: []
runs: 1
graders:
  - type: "llm"
    name: "same-task-token-safety"
    focus: "last_message"
    criteria: "The response calls anonymous accept_invitation without repeating the token, immediately shows the returned connection code, retries connection_status to open OAuth once, tells the user the page always requires the code, never requests email verification, continues onboarding after connection, re-asks App details and an explicit Bark, Product Webhook, or defer choice before Product creation, and requires approval before Apple project edits."
expected_outcome: "Complete one-page invitation OAuth without exposing credentials."
