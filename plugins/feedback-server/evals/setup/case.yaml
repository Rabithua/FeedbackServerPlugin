schema_version: "1.1"
name: "invitation-authentication-onboarding"
description: "Establishes host OAuth, binds with the invitation discriminator, and continues onboarding."
tags: ["setup"]
execution:
  prompt: "我把包含邀请短码的 FeedbackKit 邀请 Prompt 发给你了。请安装插件，在当前任务完成账号绑定和首个 App 接入；不要在回复中复述短码。"
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: []
runs: 1
graders:
  - type: "llm"
    name: "discriminated-invitation-binding"
    focus: "last_message"
    criteria: "The response invokes the OAuth2-protected authenticate tool whose scopes list is empty, recognizes that OAuth success leaves the connection unbound, calls authenticate with the exact invitation discriminator without repeating the code, treats success as immediate binding, and only then calls connection_status. It continues onboarding, re-asks App details and an explicit Bark, Product Webhook, or defer choice before Product creation, and requires approval before Apple project edits. It does not move invitation input or email verification into the browser."
expected_outcome: "Bind an invited account immediately after host OAuth and complete guided onboarding."
