schema_version: "1.1"
name: "same-task-passwordless-onboarding"
description: "Runs invitation acceptance from the installed plugin without MCP hot reload."
tags: ["setup"]
execution:
  prompt: "我把 FeedbackKit 邀请 Prompt 发给你了。请安装插件，在当前任务完成账号和首个 App 接入；令牌不要放进参数或输出。"
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: []
runs: 1
graders:
  - type: "llm"
    name: "same-task-token-safety"
    focus: "last_message"
    criteria: "The response locates the installed bundle from Codex source.path or Claude installPath, runs feedbackkit accept-invite in the current task with the token on stdin, never asks for username/password, re-asks App details, requires an explicit Bark, Product Webhook, or defer choice after Product creation, and requires approval before Apple project edits."
expected_outcome: "Complete safe passwordless onboarding in the current task without MCP hot reload."
