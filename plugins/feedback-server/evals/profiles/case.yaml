schema_version: "1.1"
name: "global-profile-switch"
description: "Explains safe global profile switching and environment precedence."
tags: ["profiles"]
execution:
  prompt: "我要把 FeedbackKit 从 work profile 切到 personal。请给出正确 CLI 流程，并先说明影响范围。环境变量凭据存在时也请说明 active profile 会怎样显示。"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: []
runs: 1
graders:
  - type: "llm"
    name: "profile-global-impact"
    focus: "last_message"
    criteria: "The answer warns before switching that the profile is global to all local FeedbackKit Codex and Claude sessions, uses feedbackkit profile list/use commands, and says complete environment credentials take precedence with activeProfile null."
expected_outcome: "Warn about global impact and provide the safe profile CLI flow."
